name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    backend-formatting:
        name: Backend / Formatting
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Check PHP formatting
              run: vendor/bin/pint --test

    frontend-formatting:
        name: Frontend / Formatting
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install Node.js dependencies
              run: npm ci

            - name: Check frontend formatting
              run: npm run format:check

    backend-tests:
        name: Backend / Tests
        runs-on: ubuntu-latest
        timeout-minutes: 10

        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_DB: Life-Log_testing
                    POSTGRES_USER: life_log
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U life_log -d Life-Log_testing"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_pgsql
                  coverage: none

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Prepare application
              run: |
                  cp .env.example .env
                  php artisan key:generate --no-interaction

            - name: Run tests
              run: php artisan test --compact
              env:
                  DB_HOST: 127.0.0.1
                  DB_USERNAME: life_log
                  DB_PASSWORD: password

    frontend-build:
        name: Frontend / Build
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install Node.js dependencies
              run: npm ci

            - name: Build frontend assets
              run: npm run build
